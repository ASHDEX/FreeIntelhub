[project]
name = "anthropic-cookbook"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.71.0",
    "ipykernel>=7.1.0",
    "notebook>=7.5.6",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "jupyter>=1.1.1",
    "rich>=14.2.0",
    "python-dotenv>=1.2.1",
    "voyageai>=0.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.2",
    "pytest>=8.3.3",
    "nbval>=0.11.0",
    "pre-commit>=3.8.0",
    "nbconvert>=7.17.0",  # CVE-2025-53000: Uncontrolled Search Path via Inkscape on Windows
    "pyyaml>=6.0.3",
    "tox>=4.32.0",
    "tox-uv>=1.29.0",
]

[tool.uv]
# Security: force patched versions of vulnerable transitive dependencies (Dependabot alerts 2026-03-20)
constraint-dependencies = [
    "aiohttp>=3.13.3",        # multiple CVEs: zip bomb, DoS, unicode smuggling, path disclosure
    "virtualenv>=20.36.1",    # CVE-2026-22702: TOCTOU race / link following
    "orjson>=3.11.6",         # CVE-2025-67221: resource exhaustion via deep recursion
    "filelock>=3.20.3",       # CVE-2025-68146, CVE-2026-22701: TOCTOU symlink attacks
    "langsmith>=0.6.3",       # SSRF via tracing header injection
    "langchain-core>=1.2.11", # SSRF via image_url; serialization injection (critical)
    "tornado>=6.5.5",         # DoS via multipart parts; incomplete cookie validation
    "pillow>=12.1.1",         # out-of-bounds write when loading PSD images
    "urllib3>=2.6.3",         # decompression bomb (streaming API redirect bypass)
]

[tool.hatch.build.targets.wheel]
packages = ["anthropic_cookbook"]  # Dummy package for build system

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]  # Ruff v0.6.0+ includes notebooks by default, but explicit is better

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = [
    "E501",   # line too long
    "S101",   # assert used (ok in tests)
    "S301",   # pickle usage ok for local data in cookbooks
    "S311",   # pseudo-random generators ok for non-crypto
    "S608",   # SQL string construction ok for demo/educational code
    "N806",   # variable in function should be lowercase (allow for API responses)
]

[tool.ruff.lint.per-file-ignores]
# Notebooks have different conventions than regular Python files
"*.ipynb" = [
    "E402",   # imports mid-file
    "F811",   # redefinitions (common in notebooks)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (requires notebook execution)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

