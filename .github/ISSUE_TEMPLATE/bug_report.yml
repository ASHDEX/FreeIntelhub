name: Bug Report
description: Report a bug or issue with FreeIntelHub
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.
        Before submitting, search [existing issues](https://github.com/ASHDEX/FreeIntelhub/issues) to check if this has already been reported.

  - type: input
    id: affected
    attributes:
      label: Affected Feature / Page
      description: Which feature, route, or page has the issue?
      placeholder: "e.g., /lookup, feed aggregation, alert emails"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What's wrong? Describe what you expected vs what happened.
      placeholder: |
        When I navigate to /lookup and enter an IP address, I get a 500 error.

        Expected: IP reputation data is returned
        Actual: Internal Server Error
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to /lookup
        2. Enter IP: 1.2.3.4
        3. Click Lookup
        4. 500 error appears
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error Message / Logs
      description: Paste any error messages or server logs here
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - Node.js version: 20.x
        - OS: Ubuntu 22.04 / Windows 11 / macOS
        - Deployment: local / Hostinger / Docker
    validations:
      required: false

  - type: dropdown
    id: willing_to_pr
    attributes:
      label: Would you be willing to submit a PR to fix this?
      options:
        - "Yes, I can submit a PR"
        - "Maybe, with guidance"
        - "No, I'm just reporting"
    validations:
      required: false
