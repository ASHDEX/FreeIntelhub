name: Feature Request
description: Propose a new feature or integration for FreeIntelHub
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please read our [Issue Guidelines](https://github.com/ASHDEX/FreeIntelhub/blob/main/.github/ISSUE_GUIDELINES.md) before submitting.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this feature solve? Who benefits?
      placeholder: |
        As a SOC analyst, I want to be able to export IOC watchlists to STIX format
        so I can share them with other platforms...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see
      placeholder: |
        Add a /export/watchlist?format=stix endpoint that converts stored IOCs
        into STIX 2.1 bundles...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've tried
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Links to relevant APIs, data sources, or examples
    validations:
      required: false
